[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[profile.default.fuzz]
runs = 512
seed = "0xc8b14164da9fb30cd6f9ddb7742526178af2312f9edc4dd9d1d0d23269acfc17"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

[fmt]
line_length = 120
ignore = ["lib/**"]
